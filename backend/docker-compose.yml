services:
  postgres:
    image: postgres:16-alpine
    container_name: gymtracker-postgres
    environment:
      POSTGRES_DB: gymtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gymtracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymtracker-postgres-data:
