server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/api/admin/accounts(?:/|$) {
        return 404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
